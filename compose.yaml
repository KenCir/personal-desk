services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: personal_desk
      POSTGRES_USER: personal_desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_desk}
      TZ: Asia/Tokyo
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_desk -d personal_desk']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
